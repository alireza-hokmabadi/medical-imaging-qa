[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-imaging-qa"
version = "0.1.0"
description = "Reproducible QA for NIfTI images and segmentation label maps."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  {name = "Alireza Hokmabadi"}
]
keywords = ["medical-imaging", "nifti", "segmentation", "quality-assurance", "research-software"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Medical Science Apps."
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "nibabel>=5.1",
  "typer>=0.12",
  "rich>=13.7"
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "build>=1.2"
]

[project.scripts]
miqa = "medical_imaging_qa.cli:main"

[project.urls]
Homepage = "https://github.com/alireza-hokmabadi/medical-imaging-qa"
Repository = "https://github.com/alireza-hokmabadi/medical-imaging-qa"
Issues = "https://github.com/alireza-hokmabadi/medical-imaging-qa/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
